# 必須チェック ac-coverage。PR の本文の `AC:` 行の ID ごとに、タグ付きのテストがあるかを確かめる。
# 本文を直したときにも走らせるため、CI(ci.yml)とは別のワークフローにしている。
name: AC coverage

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ac-coverage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  pull-requests: read

env:
  BASE_REF: ${{ github.event.pull_request.base.ref }}

jobs:
  ac-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: git fetch --no-tags origin "$BASE_REF"
      - name: Use the CI scripts of the base branch
        run: .github/ci-scripts.sh
      - uses: actions/setup-node@v5
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo_mysql, intl, zip, bcmath, pcntl
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: |
          (cd e2e && npm ci --no-audit --no-fund)
          (cd frontend && npm ci --no-audit --no-fund)
          (cd backend && composer install --no-interaction --prefer-dist --no-progress)
      # テストの一覧は各ツールに出させる(コメントの中の ID や、スイートに入らないファイルは数えない)
      - name: List the tests of each suite
        run: |
          (cd e2e && npx playwright test --list --reporter=json) > "$RUNNER_TEMP/playwright.json"
          (cd frontend && npx vitest list --json="$RUNNER_TEMP/vitest.json")
          (cd backend && vendor/bin/pest --list-groups --colors=never) > "$RUNNER_TEMP/pest-groups.txt"
      - name: Read the PR description and the issue it closes
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          issue="$(grep -ioE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?) +#[0-9]+' "$RUNNER_TEMP/pr-body.md" | head -n 1 | grep -oE '[0-9]+$' || true)"
          if [ -n "$issue" ]; then
            gh issue view "$issue" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/issue-body.md"
            echo "ISSUE_ARGS=--issue-body-file=$RUNNER_TEMP/issue-body.md" >> "$GITHUB_ENV"
          fi
      - name: Every acceptance criterion on the AC line has a tagged test
        run: >-
          python3 "$RUNNER_TEMP/ci/ac_coverage.py"
          --pr-body-file "$RUNNER_TEMP/pr-body.md" $ISSUE_ARGS
          --requirements docs/requirements.md
          --playwright-json "$RUNNER_TEMP/playwright.json"
          --vitest-json "$RUNNER_TEMP/vitest.json"
          --pest-groups "$RUNNER_TEMP/pest-groups.txt"

  # guard は ci.yml、ac-coverage.yml、guard.yml の 3 か所に同じ手順で置く(docs/adr/0009)。
  # PR が 1 つを「何もせずに成功する」ように書き換えても、残りがその書き換えを保護パスの変更として落とす。
  # 1 つのファイルの書き換えで全部が止まらないよう、共有のスクリプトや action を使わず手順をここに書く。
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # PR が閉じる issue の "Likely files" と、オーナーの承認のコメントを読む(名指しされた基準画像と、承認された既存テストだけ変更を認める)
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # 判定のスクリプトは base ブランチのものを使う(base にまだ無い bootstrap の PR だけ PR のもの)
      - name: Forbidden shortcuts, protected paths and dependencies
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          dest="$RUNNER_TEMP/guard"
          rm -rf "$dest" && mkdir -p "$dest"
          if git cat-file -e "origin/$BASE_REF:.github/scripts/guard.py" 2>/dev/null; then
            git archive "origin/$BASE_REF" .github/scripts | tar -x -C "$dest" --strip-components=2
          else
            cp -R .github/scripts/. "$dest/"
          fi
          python3 -m unittest discover -s "$dest/tests" -p "test_*.py"
          issue_args=()
          issue="$(printf '%s\n' "$PR_BODY" | grep -ioE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?) +#[0-9]+' | head -n 1 | grep -oE '[0-9]+$' || true)"
          if [ -n "$issue" ]; then
            gh issue view "$issue" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/guard-issue-body.md"
            gh issue view "$issue" --repo "$GITHUB_REPOSITORY" --json comments > "$RUNNER_TEMP/guard-issue-comments.json"
            issue_args=(--issue-body-file "$RUNNER_TEMP/guard-issue-body.md" --issue-comments-file "$RUNNER_TEMP/guard-issue-comments.json")
          fi
          # ループは GitHub App で動く。既存テストの変更は、オーナーが書いた承認のコメントだけで開く(docs/adr/0018)
          python3 "$dest/guard.py" --base "origin/$BASE_REF" --approver "$REPO_OWNER" "${issue_args[@]}"
