# 必須チェック guard(docs/adr/0008)。
# pull_request_target なので、PR の版ではなく base ブランチにあるこのファイルとスクリプトで動く。
# PR がこのワークフローや .github/scripts/ を書き換えても、guard はその変更を保護パスの変更として止める。
# PR のコードは実行しない。PR の head は git のオブジェクトとして取り込み、差分と中身を読むだけにする。
name: Guard

on:
  pull_request_target:

concurrency:
  group: guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Check out the base branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: Fetch the base branch and the PR head as data
        run: |
          git fetch --no-tags origin "$BASE_REF" "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/${PR_NUMBER}/head"
          git cat-file -e "${HEAD_SHA}^{commit}"
      - name: Self-test of the CI scripts
        run: python3 -m unittest discover -s .github/scripts/tests -p "test_*.py"
      - name: Forbidden shortcuts, protected paths and dependencies
        run: python3 .github/scripts/guard.py --base "origin/$BASE_REF" --head "$HEAD_SHA"
