# 必須チェック guard(docs/adr/0004、0009)。同じ guard ジョブが ci.yml と ac-coverage.yml にもある。
name: Guard

on:
  pull_request:

concurrency:
  group: guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BASE_REF: ${{ github.event.pull_request.base.ref }}

jobs:
  # guard は ci.yml、ac-coverage.yml、guard.yml の 3 か所に同じ手順で置く(docs/adr/0009)。
  # PR が 1 つを「何もせずに成功する」ように書き換えても、残りがその書き換えを保護パスの変更として落とす。
  # 1 つのファイルの書き換えで全部が止まらないよう、共有のスクリプトや action を使わず手順をここに書く。
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: echo "guard skipped" && exit 0
