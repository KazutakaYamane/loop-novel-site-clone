# 必須チェック guard(docs/adr/0004、0009)。同じ guard ジョブが ci.yml と ac-coverage.yml にもある。
name: Guard

on:
  pull_request:

concurrency:
  group: guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BASE_REF: ${{ github.event.pull_request.base.ref }}

jobs:
  # guard は ci.yml、ac-coverage.yml、guard.yml の 3 か所に同じ手順で置く(docs/adr/0009)。
  # PR が 1 つを「何もせずに成功する」ように書き換えても、残りがその書き換えを保護パスの変更として落とす。
  # 1 つのファイルの書き換えで全部が止まらないよう、共有のスクリプトや action を使わず手順をここに書く。
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # 判定のスクリプトは base ブランチのものを使う(base にまだ無い bootstrap の PR だけ PR のもの)
      - name: Forbidden shortcuts, protected paths and dependencies
        run: |
          git fetch --no-tags origin "$BASE_REF"
          dest="$RUNNER_TEMP/guard"
          rm -rf "$dest" && mkdir -p "$dest"
          if git cat-file -e "origin/$BASE_REF:.github/scripts/guard.py" 2>/dev/null; then
            git archive "origin/$BASE_REF" .github/scripts | tar -x -C "$dest" --strip-components=2
          else
            cp -R .github/scripts/. "$dest/"
          fi
          python3 -m unittest discover -s "$dest/tests" -p "test_*.py"
          python3 "$dest/guard.py" --base "origin/$BASE_REF"
      # 違反を見つけたら、同じ commit の他の guard も失敗にする。PR が 1 つの guard を書き換えて成功させても、
      # `guard` の名前で成功が残らないようにする(docs/adr/0012)
      - name: Fail every guard check on this commit
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 "$RUNNER_TEMP/guard/guard_checks.py" --sha "$HEAD_SHA"
